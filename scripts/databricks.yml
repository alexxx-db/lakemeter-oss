bundle:
  name: lakemeter-installer

variables:
  reporting_package_pause_status:
    description: >-
      Schedule pause status for the weekly reporting package job (PAUSED
      or UNPAUSED). Deployed PAUSED by default; enable with
      --var="reporting_package_pause_status=UNPAUSED" or unpause in the
      Workflows UI.
    default: PAUSED
  chargeback_export_pause_status:
    description: >-
      Schedule pause status for the monthly chargeback export job (PAUSED
      or UNPAUSED). Deployed PAUSED by default; enable with
      --var="chargeback_export_pause_status=UNPAUSED" or unpause in the
      Workflows UI.
    default: PAUSED
  actuals_sync_pause_status:
    description: >-
      Schedule pause status for the actuals usage sync job (PAUSED or
      UNPAUSED). Deployed PAUSED by default; enable with
      --var="actuals_sync_pause_status=UNPAUSED" or unpause in the
      Workflows UI.
    default: PAUSED
  pricing_sync_pause_status:
    description: >-
      Schedule pause status for the pricing sync job (PAUSED or UNPAUSED).
      Deployed PAUSED by default; enable with
      --var="pricing_sync_pause_status=UNPAUSED" or unpause in the
      Workflows UI.
    default: PAUSED

sync:
  include:
    - "notebooks/**"
    - "pricing_data/**"
    - "app_source/**"
    - "functions/**"
  exclude:
    - "**/__pycache__/**"
    - "**/*.pyc"

resources:
  jobs:
    lakemeter_installer:
      name: "Lakemeter Installer"
      parameters:
        - name: instance_name
          default: "lakemeter-customer"
        - name: db_name
          default: "lakemeter_pricing"
        - name: app_name
          default: "lakemeter"
        - name: secrets_scope
          default: "lakemeter-secrets"
        - name: claude_endpoint
          default: "databricks-claude-opus-4-6"

      # Task dependency graph (parallel where possible):
      #
      #   01_provision (26s)  ║  05a_create_app (~3min)   ← parallel from start
      #         │             ║        │
      #   02_create_db (17s)  ║        │
      #         │             ╠════════╝
      #     ┌───┴──────┐      │
      #   02b_funcs  03_data  05b_grant_sp (~30s)
      #     (12s)    (19s)         │
      #               │      06_deploy_app (10m41s)
      #          04_sku (10s)      │
      #                       07_verify (~30s)
      #
      tasks:
        # ── Branch 1: Database provisioning ──────────────────────────────
        - task_key: provision_lakebase
          notebook_task:
            notebook_path: ./notebooks/01_provision_lakebase.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
          environment_key: serverless_env

        - task_key: create_database
          depends_on:
            - task_key: provision_lakebase
          notebook_task:
            notebook_path: ./notebooks/02_create_database.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

        - task_key: create_functions
          depends_on:
            - task_key: create_database
          notebook_task:
            notebook_path: ./notebooks/02b_create_functions.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
          environment_key: serverless_env

        - task_key: load_pricing_data
          depends_on:
            - task_key: create_database
          notebook_task:
            notebook_path: ./notebooks/03_load_pricing_data.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

        - task_key: create_sku_mapping
          depends_on:
            - task_key: load_pricing_data
          notebook_task:
            notebook_path: ./notebooks/04_create_sku_mapping.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
          environment_key: serverless_env

        # ── Branch 2: App creation (parallel with DB provisioning) ──────
        - task_key: create_app
          notebook_task:
            notebook_path: ./notebooks/05a_create_app.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              app_name: "{{job.parameters.app_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
              claude_endpoint: "{{job.parameters.claude_endpoint}}"
          environment_key: serverless_env

        # ── Merge point: grant SP access (needs app + database) ─────────
        - task_key: grant_app_access
          depends_on:
            - task_key: create_app
            - task_key: create_database
          notebook_task:
            notebook_path: ./notebooks/05b_grant_app_access.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              app_name: "{{job.parameters.app_name}}"
          environment_key: serverless_env

        # ── Deploy (needs app configured + SP granted) ──────────────────
        - task_key: deploy_app
          depends_on:
            - task_key: grant_app_access
          notebook_task:
            notebook_path: ./notebooks/06_deploy_app.py
            base_parameters:
              app_name: "{{job.parameters.app_name}}"
          environment_key: serverless_env

        # ── Verify (smoke tests against deployed app) ─────────────────
        - task_key: verify_installation
          depends_on:
            - task_key: deploy_app
          notebook_task:
            notebook_path: ./notebooks/07_verify_installation.py
            base_parameters:
              app_name: "{{job.parameters.app_name}}"
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "5"

    # ── Recurring pricing refresh ───────────────────────────────────────
    # Reloads the shipped pricing snapshot into Lakebase monthly, so the
    # sync_* tables pick up pricing updates shipped with new releases
    # without re-running the full installer. Deployed PAUSED by default —
    # enable with:
    #   databricks bundle deploy --var="pricing_sync_pause_status=UNPAUSED"
    # or unpause the schedule in the Workflows UI. Safe to run any time:
    # the notebook refreshes tables via TRUNCATE + INSERT.
    lakemeter_pricing_sync:
      name: "Lakemeter Pricing Sync"
      parameters:
        - name: instance_name
          default: "lakemeter-customer"
        - name: db_name
          default: "lakemeter_pricing"
        - name: secrets_scope
          default: "lakemeter-secrets"

      schedule:
        quartz_cron_expression: "0 0 6 1 * ?"  # 06:00 UTC on the 1st
        timezone_id: "UTC"
        pause_status: ${var.pricing_sync_pause_status}

      tasks:
        - task_key: reload_pricing_data
          notebook_task:
            notebook_path: ./notebooks/03_load_pricing_data.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "5"

    # ── Daily actuals (usage) sync ──────────────────────────────────────
    # Ingests system.billing.usage (joined to list prices) into Lakebase
    # actuals_usage_daily. Incremental via a watermark, idempotent via a
    # DELETE + INSERT reprocess window. Deployed PAUSED by default; enable
    # with:
    #   databricks bundle deploy --var="actuals_sync_pause_status=UNPAUSED"
    # Requires read access to system.billing.usage and
    # system.billing.list_prices for the deploying identity.
    lakemeter_actuals_sync:
      name: "Lakemeter Actuals Sync"
      parameters:
        - name: instance_name
          default: "lakemeter-customer"
        - name: db_name
          default: "lakemeter_pricing"
        - name: secrets_scope
          default: "lakemeter-secrets"

      schedule:
        quartz_cron_expression: "0 0 4 * * ?"  # 04:00 UTC daily
        timezone_id: "UTC"
        pause_status: ${var.actuals_sync_pause_status}

      tasks:
        # Schema migrations run first: every downstream task can assume
        # the pipeline tables exist.
        - task_key: apply_migrations
          notebook_task:
            notebook_path: ./notebooks/11_apply_migrations.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

        - task_key: sync_actuals_usage
          depends_on:
            - task_key: apply_migrations
          notebook_task:
            notebook_path: ./notebooks/08_sync_actuals.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

        # Rebuild the attribution rollup right after each ingestion, so
        # attribution_daily is never behind actuals_usage_daily.
        - task_key: build_attribution
          depends_on:
            - task_key: sync_actuals_usage
          notebook_task:
            notebook_path: ./notebooks/09_build_attribution.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

        # Classify attributed spend into product lines and ingest Genie /
        # dashboard query activity from system.query.history.
        - task_key: enrich_product_coverage
          depends_on:
            - task_key: build_attribution
          notebook_task:
            notebook_path: ./notebooks/10_enrich_product_coverage.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

        # Compare month-to-date spend against ref_budgets and record
        # breaches in budget_alerts.
        - task_key: check_budgets
          depends_on:
            - task_key: enrich_product_coverage
          notebook_task:
            notebook_path: ./notebooks/12_check_budgets.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "5"

    # ── Monthly chargeback export ─────────────────────────────────────
    # Writes a per-cost-center, per-user chargeback CSV for the previous
    # month into a UC volume, for import into Finance systems. Deployed
    # PAUSED by default; enable with:
    #   databricks bundle deploy --var="chargeback_export_pause_status=UNPAUSED"
    lakemeter_chargeback_export:
      name: "Lakemeter Chargeback Export"
      parameters:
        - name: instance_name
          default: "lakemeter-customer"
        - name: db_name
          default: "lakemeter_pricing"
        - name: secrets_scope
          default: "lakemeter-secrets"
        - name: export_catalog
          default: "main"
        - name: export_schema
          default: "default"
        - name: export_volume
          default: "lakemeter_chargeback"

      schedule:
        quartz_cron_expression: "0 0 5 1 * ?"  # 05:00 UTC on the 1st
        timezone_id: "UTC"
        pause_status: ${var.chargeback_export_pause_status}

      tasks:
        - task_key: export_chargeback
          notebook_task:
            notebook_path: ./notebooks/13_export_chargeback.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
              export_month: "previous"
              export_catalog: "{{job.parameters.export_catalog}}"
              export_schema: "{{job.parameters.export_schema}}"
              export_volume: "{{job.parameters.export_volume}}"
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "5"

    # ── Weekly reporting package ──────────────────────────────────────
    # Copies the Lakebase reporting rollups into Unity Catalog rpt_*
    # tables and deploys the AI/BI dashboard definition and Genie space.
    # Deployed PAUSED by default; enable with:
    #   databricks bundle deploy --var="reporting_package_pause_status=UNPAUSED"
    lakemeter_reporting_package:
      name: "Lakemeter Reporting Package"
      parameters:
        - name: instance_name
          default: "lakemeter-customer"
        - name: db_name
          default: "lakemeter_pricing"
        - name: secrets_scope
          default: "lakemeter-secrets"
        - name: reporting_catalog
          default: "lakemeter_catalog"
        - name: reporting_schema
          default: "lakemeter"

      schedule:
        quartz_cron_expression: "0 0 7 ? * MON"  # 07:00 UTC on Mondays
        timezone_id: "UTC"
        pause_status: ${var.reporting_package_pause_status}

      tasks:
        - task_key: package_reporting
          notebook_task:
            notebook_path: ./notebooks/14_package_reporting.py
            base_parameters:
              instance_name: "{{job.parameters.instance_name}}"
              db_name: "{{job.parameters.db_name}}"
              secrets_scope: "{{job.parameters.secrets_scope}}"
              reporting_catalog: "{{job.parameters.reporting_catalog}}"
              reporting_schema: "{{job.parameters.reporting_schema}}"
          environment_key: serverless_env

      environments:
        - environment_key: serverless_env
          spec:
            environment_version: "5"
