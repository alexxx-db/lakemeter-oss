# Databricks App Configuration
# For full repo deployment (includes both backend/ and frontend/ folders)

command:
  - "/bin/bash"
  - "-c"
  - "cd backend && PYTHONPATH=. uvicorn app.main:app --host 0.0.0.0 --port 8000"

env:
  - name: "ENVIRONMENT"
    value: "production"
  - name: "DATABRICKS_HOST"
    value: "{{databricks_host}}"
  - name: "CORS_ORIGINS"
    value: ""

