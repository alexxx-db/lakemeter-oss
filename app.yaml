# Databricks App Configuration
# For full repo deployment (includes both backend/ and frontend/ folders)

command:
  - "/bin/bash"
  - "-c"
  - "cd backend && ../.venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000"

env:
  # App environment
  - name: "ENVIRONMENT"
    value: "production"
  - name: "CORS_ORIGINS"
    value: ""
    
  - name: "DATABRICKS_HOST"
    value: "{{databricks_host}}"

  # Secrets scope containing SP credentials
  - name: "DATABRICKS_SECRETS_SCOPE"
    valueFrom: "lakemeter-secrets-scope"
  - name: "SP_CLIENT_ID_KEY"
    value: "sp_clientid"
  - name: "SP_SECRET_KEY"
    value: "sp_secret"

  # Lakebase database configuration (populated by installer)
  - name: "LAKEBASE_INSTANCE_NAME"
    valueFrom: "lakemeter-lakebase-instance"
  - name: "DB_HOST"
    valueFrom: "lakemeter-db-host"
  - name: "DB_USER"
    valueFrom: "lakemeter-db-user"
  - name: "DB_NAME"
    valueFrom: "lakemeter-db-name"
  - name: "DB_PORT"
    value: "5432"
  - name: "DB_SSLMODE"
    value: "require"

