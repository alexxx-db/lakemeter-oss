name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest openpyxl pillow pyyaml

      - name: Compile Python sources
        run: python -m compileall -q backend/app tests

      - name: Run stable Python tests
        run: |
          python -m pytest \
            tests/test_integration_validation/test_suite_completeness.py \
            tests/docs_media/test_docs_build.py \
            tests/test_security_config.py \
            tests/test_authz_users_chat.py \
            tests/test_lakebase_grants.py \
            tests/test_pricing_freshness.py \
            tests/test_conversation_store.py \
            tests/test_dab_config.py \
            tests/test_database_retry.py \
            tests/test_line_item_field_mapping.py \
            tests/test_p3_docs_and_uc.py \
            tests/schema \
            tests/parity \
            tests/export/jobs/test_jobs_calculations.py \
            tests/export/dbsql/test_dbsql_calculations.py \
            tests/export/dlt/test_dlt_calculations.py
        env:
          DATABASE_URL: postgresql://u:p@localhost:5432/db
          ENVIRONMENT: local

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docs-build:
    name: Documentation build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install documentation dependencies
        working-directory: docs-site
        run: npm ci

      - name: Build documentation
        working-directory: docs-site
        run: npm run build
